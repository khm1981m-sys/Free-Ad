<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبلیغات رایگان | MehrSam Ads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
        .hero-bg { background: linear-gradient(135deg, #6b21a8, #c026d3); }
        .ad-card { transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .ad-card:hover { transform: scale(1.05) translateY(-10px); box-shadow: 0 25px 50px -12px rgb(139 92 246 / 0.4); }
        .hero-bg-img { background-image: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://picsum.photos/id/1015/1920/1080'); background-size: cover; background-position: center; }
        .toast { animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards; }
        @keyframes toastIn { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastOut { from { opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- هدر -->
    <header class="bg-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-bolt text-4xl text-purple-600"></i>
                <h1 class="text-4xl font-bold text-purple-700">تبلیغات رایگان</h1>
            </div>
            <nav class="flex gap-10 text-xl font-medium">
                <a href="#" onclick="showSection('home')" class="hover:text-purple-600 transition">خانه</a>
                <a href="#" onclick="showSection('ads')" class="hover:text-purple-600 transition">تبلیغات</a>
                <a href="#" onclick="showSection('add')" class="hover:text-purple-600 transition">ثبت جدید</a>
                <a href="#" onclick="showSection('admin')" class="hover:text-purple-600 transition">ادمین</a>
            </nav>
            <button onclick="toggleLoginModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-3xl font-bold text-lg transition">ورود / ثبت‌نام</button>
        </div>
    </header>

    <!-- هیرو با تصویر واقعی -->
    <section id="home" class="hero-bg-img text-white py-28 relative">
        <div class="max-w-6xl mx-auto px-6 text-center z-10">
            <h2 class="text-7xl font-black mb-6 leading-tight">تبلیغات رایگان<br>برای همه خفن!</h2>
            <p class="text-3xl mb-12">همین الان تبلیغت رو ثبت کن و رایگان نمایش بده</p>
            <button onclick="showSection('add')" class="bg-white text-purple-700 px-12 py-5 rounded-3xl text-2xl font-bold hover:bg-gray-100 transition">ثبت تبلیغ رایگان</button>
        </div>
        <div class="absolute inset-0 bg-gradient-to-r from-purple-900/80 to-purple-900/40"></div>
    </section>

    <!-- تبلیغات -->
    <section id="ads" class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-5xl font-bold text-center mb-12">تبلیغات موجود</h2>
        <div id="ads-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <!-- ثبت تبلیغ -->
    <section id="add" class="bg-white py-16">
        <div class="max-w-2xl mx-auto px-6">
            <h2 class="text-5xl font-bold text-center mb-10">ثبت تبلیغ جدید</h2>
            <form id="addForm" class="space-y-8">
                <input id="title" type="text" placeholder="عنوان تبلیغ" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl focus:outline-none focus:border-purple-500" required>
                <input id="link" type="url" placeholder="لینک تبلیغ" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl focus:outline-none focus:border-purple-500" required>
                <input id="image" type="text" placeholder="لینک تصویر تبلیغ (https://...)" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl focus:outline-none focus:border-purple-500" required>
                <input id="duration" type="number" placeholder="مدت نمایش (روز)" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl focus:outline-none focus:border-purple-500" value="7" required>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-6 rounded-3xl text-2xl font-bold transition">ثبت تبلیغ رایگان 🚀</button>
            </form>
        </div>
    </section>

    <!-- پنل ادمین -->
    <section id="admin" class="hidden max-w-5xl mx-auto px-6 py-16">
        <div class="bg-white rounded-3xl shadow-2xl p-10">
            <h2 class="text-5xl font-bold text-center mb-8">پنل ادمین</h2>
            <input id="adminPass" type="password" placeholder="رمز عبور ادمین" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl mb-6 focus:outline-none focus:border-purple-500">
            <button onclick="checkAdminPass()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-6 rounded-3xl text-2xl font-bold transition">ورود به پنل ادمین</button>
            
            <div id="adminContent" class="hidden mt-12">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-bold">لیست تبلیغات</h3>
                    <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-3xl">خروج از پنل</button>
                </div>
                <div id="admin-ads" class="grid grid-cols-1 gap-6"></div>
            </div>
        </div>
    </section>

    <footer class="bg-gray-900 text-white py-12 text-center">
        <p class="text-xl">تبلیغات رایگان خفن • ساخته شده برای تو</p>
    </footer>

    <!-- مودال ورود/ثبت‌نام -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-10 w-full max-w-md shadow-2xl">
            <h3 class="text-4xl font-bold text-center mb-8">ورود یا ثبت‌نام</h3>
            <input id="userName" type="text" placeholder="نام کاربری" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl mb-4">
            <input id="userPass" type="password" placeholder="رمز عبور" class="w-full p-6 border-2 border-gray-300 rounded-3xl text-xl mb-8">
            <button onclick="registerUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-5 rounded-3xl text-xl font-bold mb-4">ثبت‌نام</button>
            <button onclick="loginUser()" class="w-full border-2 border-blue-600 text-blue-600 py-5 rounded-3xl text-xl font-bold">ورود</button>
            <button onclick="closeLoginModal()" class="mt-6 w-full text-gray-500">بستن</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-6 bg-purple-600 text-white px-8 py-4 rounded-3xl shadow-2xl text-xl font-medium toast"></div>

    <script>
        // داده‌ها
        let ads = [
            { id: 1, title: "فروش گوشی هوشمند", link: "https://example.com", image: "https://picsum.photos/id/1015/600/400", duration: 10 },
            { id: 2, title: "پیتزا دلشاد", link: "https://example.com", image: "https://picsum.photos/id/201/600/400", duration: 7 }
        ];
        let currentUser = null;
        let isAdminLogged = false;

        function saveAds() {
            localStorage.setItem('mehrsams-ads', JSON.stringify(ads));
        }
        function loadAds() {
            const saved = localStorage.getItem('mehrsams-ads');
            if (saved) ads = JSON.parse(saved);
        }

        function renderAds() {
            const grid = document.getElementById('ads-grid');
            grid.innerHTML = '';
            ads.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'ad-card bg-white rounded-3xl overflow-hidden shadow-2xl';
                card.innerHTML = `
                    <img src="${ad.image}" class="w-full h-60 object-cover">
                    <div class="p-8">
                        <h3 class="font-bold text-3xl mb-3">${ad.title}</h3>
                        <p class="text-purple-600 font-medium text-xl mb-6">مدت: ${ad.duration} روز</p>
                        <a href="${ad.link}" target="_blank" class="block w-full bg-purple-600 hover:bg-purple-700 text-white text-center py-5 rounded-3xl text-2xl font-bold transition">مشاهده تبلیغ</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addAd(e) {
            e.preventDefault();
            const newAd = {
                id: Date.now(),
                title: document.getElementById('title').value.trim(),
                link: document.getElementById('link').value.trim(),
                image: document.getElementById('image').value.trim() || 'https://picsum.photos/id/237/600/400',
                duration: parseInt(document.getElementById('duration').value) || 7
            };
            if (!newAd.title || !newAd.link) return alert('عنوان و لینک را وارد کنید!');
            ads.unshift(newAd);
            saveAds();
            renderAds();
            document.getElementById('addForm').reset();
            showToast('تبلیغ با موفقیت ثبت شد! 🎉', 'success');
        }

        // ادمین
        function checkAdminPass() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === 'mehr sam') {
                isAdminLogged = true;
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminAds();
                showToast('ورود به پنل ادمین با موفقیت! ✅', 'success');
            } else {
                showToast('رمز اشتباه! ❌', 'error');
            }
        }

        function renderAdminAds() {
            const container = document.getElementById('admin-ads');
            container.innerHTML = '';
            ads.forEach((ad, index) => {
                const div = document.createElement('div');
                div.className = 'bg-gray-100 rounded-3xl p-8 flex justify-between items-center shadow';
                div.innerHTML = `
                    <div>
                        <h4 class="text-2xl font-bold">${ad.title}</h4>
                        <p class="text-gray-500">${ad.duration} روز • لینک: ${ad.link}</p>
                    </div>
                    <button onclick="deleteAd(${index})" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-3xl text-lg">حذف</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteAd(index) {
            if (confirm('حذف شود؟')) {
                ads.splice(index, 1);
                saveAds();
                renderAdminAds();
                showToast('تبلیغ حذف شد!', 'success');
            }
        }

        function logoutAdmin() {
            isAdminLogged = false;
            document.getElementById('adminContent').classList.add('hidden');
            showToast('از پنل ادمین خارج شدید', 'success');
        }

        // کاربر عادی
        function toggleLoginModal() {
            document.getElementById('loginModal').classList.toggle('hidden');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function registerUser() {
            const name = document.getElementById('userName').value.trim();
            const pass = document.getElementById('userPass').value.trim();
            if (name && pass) {
                currentUser = { name, pass };
                localStorage.setItem('mehrsams-user', JSON.stringify(currentUser));
                showToast(`خوش آمدی ${name} 🎉`, 'success');
                closeLoginModal();
            } else {
                showToast('نام و رمز را وارد کنید!', 'error');
            }
        }

        function loginUser() {
            const name = document.getElementById('userName').value.trim();
            const pass = document.getElementById('userPass').value.trim();
            const saved = JSON.parse(localStorage.getItem('mehrsams-user') || '{}');
            if (saved.name === name && saved.pass === pass) {
                currentUser = saved;
                showToast(`خوش آمدی دوباره ${name}!`, 'success');
                closeLoginModal();
            } else {
                showToast('نام کاربری یا رمز اشتباه!', 'error');
            }
        }

        function showSection(section) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(section).classList.remove('hidden');
        }

        function showToast(text, type) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = `hidden fixed bottom-6 left-6 px-8 py-4 rounded-3xl shadow-2xl text-xl font-medium toast ${type === 'success' ? 'bg-purple-600 text-white' : 'bg-red-600 text-white'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function init() {
            loadAds();
            renderAds();
            showSection('home');
            document.getElementById('addForm').addEventListener('submit', addAd);
            document.getElementById('adminPass').value = 'mehr sam';
        }

        window.onload = init;
    </script>
</body>
</html>
