<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHRSAM GAMING ADS | MAX 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
        .hero-bg { 
            background: linear-gradient(135deg, #0a0a1f, #1a0033); 
            perspective: 1400px;
        }
        .ad-card { 
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            transform-style: preserve-3d;
        }
        .ad-card:hover { 
            transform: rotateX(18deg) rotateY(22deg) scale(1.15) translateY(-25px); 
            box-shadow: 0 0 100px -5px rgb(167 139 250), 0 0 0 15px rgba(167, 139, 250, 0.4); 
            filter: brightness(1.3);
        }
        .hero-bg-img { 
            background-image: linear-gradient(rgba(10,10,31,0.9), rgba(10,10,31,0.9)), url('https://picsum.photos/id/1015/1920/1080'); 
            background-size: cover; 
            background-position: center; 
            animation: bg-glow 15s infinite alternate;
        }
        .scanline { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(transparent, rgba(0,255,255,0.1), transparent); 
            animation: scan 2.5s linear infinite; 
            pointer-events: none; 
        }
        .glowing-text { 
            text-shadow: 0 0 50px #67e8f9, 0 0 100px #67e8f9, 0 0 180px #a78bfa; 
        }
        .big-gold-text { 
            font-size: 5.5rem; 
            font-weight: 900; 
            text-shadow: 0 0 80px #facc15, 0 0 160px #facc15, 0 0 280px #eab308; 
            animation: gold-pulse 1.5s infinite alternate;
        }
        @keyframes bg-glow { 0% { filter: brightness(1); } 100% { filter: brightness(1.3); } }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(500%); } }
        @keyframes gold-pulse { 0% { text-shadow: 0 0 80px #facc15, 0 0 160px #facc15; } 100% { text-shadow: 0 0 100px #facc15, 0 0 200px #facc15; } }
        .neon-btn { 
            position: relative; 
            overflow: hidden; 
        }
        .neon-btn::after { 
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 40%; 
            height: 400%; 
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.8), transparent); 
            transform: skewX(-25deg); 
            animation: shine 4s infinite; 
        }
        @keyframes shine { 0% { transform: translateX(-150%) skewX(-25deg); } 20% { transform: translateX(500%) skewX(-25deg); } 100% { transform: translateX(-150%) skewX(-25deg); } }
    </style>
</head>
<body class="bg-gray-950 text-white overflow-x-hidden">

    <!-- هدر -->
    <header class="bg-black/95 border-b border-cyan-500/40 sticky top-0 z-50 backdrop-blur-lg">
        <div class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-bolt text-7xl text-cyan-400"></i>
                <h1 class="text-7xl font-black tracking-[-4px] glowing-text text-cyan-400">MEHRSAM</h1>
                <span class="text-cyan-400 text-5xl font-bold">GAMING ADS</span>
            </div>
            <nav class="flex gap-12 text-2xl font-medium">
                <a href="#" onclick="showSection('home')" class="hover:text-cyan-400 transition">خانه</a>
                <a href="#" onclick="showSection('ads')" class="hover:text-cyan-400 transition">تبلیغات</a>
                <a href="#" onclick="showSection('add')" class="hover:text-cyan-400 transition">ث ثبت تبلیغ</a>
                <a href="#" onclick="showSection('admin')" class="hover:text-cyan-400 transition">ادمین</a>
            </nav>
            <button onclick="toggleLoginModal()" class="neon-btn bg-cyan-500 hover:bg-cyan-400 text-black px-12 py-4 rounded-3xl font-bold text-2xl transition">ورود / ثبت‌نام</button>
        </div>
    </header>

    <!-- هیرو با متن بزرگ طلایی 3D -->
    <section id="home" class="hero-bg-img text-white py-40 relative overflow-hidden">
        <div class="max-w-6xl mx-auto px-6 text-center z-10">
            <h2 class="big-gold-text mb-8 leading-none">تبلیغات رایگان</h2>
            <p class="text-5xl mb-14 text-cyan-300 tracking-widest">گیمینگ 3D خفن برای همه!</p>
            <button onclick="showSection('add')" class="neon-btn bg-purple-600 hover:bg-purple-500 text-white px-20 py-8 rounded-3xl text-4xl font-bold transition">ثبت تبلیغ رایگان 🚀</button>
        </div>
        <div class="scanline"></div>
    </section>

    <!-- تبلیغات 3D -->
    <section id="ads" class="max-w-7xl mx-auto px-6 py-16">
        <h2 class="text-6xl font-bold text-center mb-12 glowing-text">تبلیغات موجود (لایو 3D)</h2>
        <div id="ads-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <!-- ثبت تبلیغ -->
    <section id="add" class="bg-black py-16">
        <div class="max-w-2xl mx-auto px-6">
            <h2 class="text-5xl font-bold text-center mb-10 glowing-text">ثبت تبلیغ جدید</h2>
            <form id="addForm" class="space-y-8">
                <input id="title" type="text" placeholder="عنوان تبلیغ" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl focus:outline-none focus:border-cyan-400" required>
                <input id="link" type="url" placeholder="لینک تبلیغ" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl focus:outline-none focus:border-cyan-400" required>
                <input id="image" type="text" placeholder="لینک تصویر تبلیغ (https://...)" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl focus:outline-none focus:border-cyan-400" required>
                <input id="duration" type="number" placeholder="مدت نمایش (روز)" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl focus:outline-none focus:border-cyan-400" value="7" required>
                <button type="submit" class="neon-btn w-full bg-cyan-500 hover:bg-cyan-400 text-black py-6 rounded-3xl text-3xl font-bold transition">ثبت تبلیغ رایگان 🚀</button>
            </form>
        </div>
    </section>

    <!-- پنل ادمین -->
    <section id="admin" class="hidden max-w-5xl mx-auto px-6 py-16">
        <div class="bg-black rounded-3xl shadow-2xl p-10 border border-cyan-500/50">
            <h2 class="text-5xl font-bold text-center mb-8 glowing-text">پنل ادمین</h2>
            <input id="adminPass" type="password" placeholder="رمز عبور ادمین" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl mb-6 focus:outline-none focus:border-cyan-400">
            <button onclick="checkAdminPass()" class="neon-btn w-full bg-purple-600 hover:bg-purple-500 text-white py-6 rounded-3xl text-3xl font-bold transition">ورود به پنل ادمین</button>
            
            <div id="adminContent" class="hidden mt-12">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-3xl font-bold">لیست تبلیغات</h3>
                    <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-3xl">خروج از پنل</button>
                </div>
                <div id="admin-ads" class="grid grid-cols-1 gap-6"></div>
            </div>
        </div>
    </section>

    <footer class="bg-black py-12 text-center border-t border-cyan-500/30">
        <p class="text-xl">MEHRSAM GAMING ADS MAX 3D • ساخته شده برای تو</p>
    </footer>

    <!-- مودال ورود/ثبت‌نام -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-zinc-900 rounded-3xl p-10 w-full max-w-md shadow-2xl border border-cyan-500/50">
            <h3 class="text-4xl font-bold text-center mb-8">ورود یا ثبت‌نام</h3>
            <input id="userName" type="text" placeholder="نام کاربری" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl mb-4">
            <input id="userPass" type="password" placeholder="رمز عبور" class="w-full p-6 border-2 border-cyan-400 rounded-3xl text-xl mb-8">
            <button onclick="registerUser()" class="neon-btn w-full bg-cyan-500 hover:bg-cyan-400 text-black py-5 rounded-3xl text-xl font-bold mb-4">ثبت‌نام</button>
            <button onclick="loginUser()" class="w-full border-2 border-cyan-400 text-cyan-400 py-5 rounded-3xl text-xl font-bold">ورود</button>
            <button onclick="closeLoginModal()" class="mt-6 w-full text-gray-400">بستن</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed bottom-6 left-6 bg-cyan-500 text-black px-8 py-4 rounded-3xl shadow-2xl text-xl font-medium toast"></div>

    <script>
        // ==================== دیتابیس واقعی MySQL (PHP) ====================
        const API = 'http://your-domain.com/'; // <<< اینجا آدرس هاست خودت رو بگذار
        let ads = [];

        function fetchAds() {
            fetch(API + 'get_ads.php')
                .then(res => res.json())
                .then(data => {
                    ads = data;
                    renderAds();
                });
        }

        function addAd(e) {
            e.preventDefault();
            const newAd = {
                title: document.getElementById('title').value.trim(),
                link: document.getElementById('link').value.trim(),
                image: document.getElementById('image').value.trim() || 'https://picsum.photos/id/237/600/400',
                duration: parseInt(document.getElementById('duration').value) || 7
            };
            if (!newAd.title || !newAd.link) return alert('عنوان و لینک را وارد کنید!');

            fetch(API + 'add_ad.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newAd)
            }).then(() => {
                fetchAds();
                document.getElementById('addForm').reset();
                showToast('تبلیغ با موفقیت ثبت شد! 🎉', 'success');
            });
        }

        function renderAds() {
            const grid = document.getElementById('ads-grid');
            grid.innerHTML = '';
            ads.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'ad-card bg-zinc-900 rounded-3xl overflow-hidden shadow-2xl border border-cyan-500/30';
                card.innerHTML = `
                    <img src="${ad.image}" class="w-full h-60 object-cover">
                    <div class="p-8">
                        <h3 class="font-bold text-3xl mb-3">${ad.title}</h3>
                        <p class="text-cyan-300 font-medium text-xl mb-6">مدت: ${ad.duration} روز</p>
                        <a href="${ad.link}" target="_blank" class="block w-full bg-purple-600 hover:bg-purple-500 text-white text-center py-5 rounded-3xl text-2xl font-bold transition">مشاهده تبلیغ</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ادمین
        function checkAdminPass() {
            const pass = document.getElementById('adminPass').value.trim();
            if (pass === 'mehr sam') {
                isAdminLogged = true;
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminAds();
                showToast('ورود به پنل ادمین با موفقیت! ✅', 'success');
            } else {
                showToast('رمز اشتباه! ❌', 'error');
            }
        }

        function renderAdminAds() {
            const container = document.getElementById('admin-ads');
            container.innerHTML = '';
            ads.forEach((ad, index) => {
                const div = document.createElement('div');
                div.className = 'bg-zinc-900 rounded-3xl p-8 flex justify-between items-center shadow border border-cyan-500/30';
                div.innerHTML = `
                    <div>
                        <h4 class="text-2xl font-bold">${ad.title}</h4>
                        <p class="text-gray-400">${ad.duration} روز • لینک: ${ad.link}</p>
                    </div>
                    <button onclick="deleteAd(${index})" class="bg-red-500 hover:bg-red-600 text-white px-8 py-3 rounded-3xl text-lg">حذف</button>
                `;
                container.appendChild(div);
            });
        }

        function deleteAd(index) {
            if (confirm('حذف شود؟')) {
                fetch(API + 'delete_ad.php?id=' + ads[index].id, { method: 'POST' }).then(() => {
                    fetchAds();
                    showToast('تبلیغ حذف شد!', 'success');
                });
            }
        }

        function logoutAdmin() {
            isAdminLogged = false;
            document.getElementById('adminContent').classList.add('hidden');
            showToast('از پنل ادمین خارج شدید', 'success');
        }

        // کاربر
        function toggleLoginModal() {
            document.getElementById('loginModal').classList.toggle('hidden');
        }
        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
        }

        function registerUser() {
            const name = document.getElementById('userName').value.trim();
            const pass = document.getElementById('userPass').value.trim();
            if (name && pass) {
                currentUser = { name, pass };
                localStorage.setItem('mehrsams-user', JSON.stringify(currentUser));
                showToast(`خوش آمدی ${name} 🎉`, 'success');
                closeLoginModal();
            } else {
                showToast('نام و رمز را وارد کنید!', 'error');
            }
        }

        function loginUser() {
            const name = document.getElementById('userName').value.trim();
            const pass = document.getElementById('userPass').value.trim();
            const saved = JSON.parse(localStorage.getItem('mehrsams-user') || '{}');
            if (saved.name === name && saved.pass === pass) {
                currentUser = saved;
                showToast(`خوش آمدی دوباره ${name}!`, 'success');
                closeLoginModal();
            } else {
                showToast('نام کاربری یا رمز اشتباه!', 'error');
            }
        }

        function showToast(text, type) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.className = `hidden fixed bottom-6 left-6 px-8 py-4 rounded-3xl shadow-2xl text-xl font-medium toast ${type === 'success' ? 'bg-cyan-500 text-black' : 'bg-red-500 text-white'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function showSection(section) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(section).classList.remove('hidden');
        }

        function init() {
            fetchAds();
            showSection('home');
            document.getElementById('addForm').addEventListener('submit', addAd);
            document.getElementById('adminPass').value = 'mehr sam';
        }

        window.onload = init;
    </script>
</body>
</html>
